<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>TODO APPLICATION</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
	crossorigin="anonymous">

</head>
<body>


	<h1 class="text-center">TODO APPLICATION</h1>


	<form action="/addtodo" method="post" class="text-center">
		<input type="text" name="taskContent" placeholder="write your task">
		<button type="submit" class="btn btn-secondary">ADD TODO</button>
	</form>

	<ul class="text-center">
		<li th:each="todo : ${listoftodos}">

			<form th:action="@{/updatetodo/{id}(id=${todo.id})}" method="post">
				<input type="text" th:value="${todo.taskContent}" name="taskContent">

				<input type="checkbox" th:checked="${todo.completionStatus}"
					name="completionStatus" onchange="this.form.submit()">

				<button type="submit" class="btn btn-success">UPDATE</button>
			</form> <a th:href="@{/deleteTODO/{id}(id=${todo.id})}" class="btn btn-danger">delete</a>
		</li>
	</ul>

</body>
<script type="module"
	src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
	integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
	crossorigin="anonymous"></script>

</html>
